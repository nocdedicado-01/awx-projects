---
- name: "Sincronizar Dispositivos de NetBox a Zabbix"
  hosts: all
  gather_facts: false

  tasks:
    - name: "Crear el host en Zabbix"
      community.zabbix.zabbix_host:
        # Cambio de server_url a zabbix_url
        zabbix_url: "http://TU_IP_ZABBIX/api_jsonrpc.php"
        # Usamos el token de la credencial de AWX
        ansible_zabbix_auth_key: "{{ zabbix_api_token }}"
        host_name: "{{ inventory_hostname }}"
        visible_name: "{{ inventory_hostname }}"
        status: enabled
        interfaces:
          - type: 2 
            main: 1
            useip: 1
            ip: "{{ ansible_host }}"
            port: "161"
        # Cambio de groups a host_groups
        host_groups:
          - "Switches Uruguay"
        # Cambio de templates a link_templates
        link_templates:
          - "Huawei CloudEngine SNMP"
      delegate_to: localhost
      when: ansible_host is defined
