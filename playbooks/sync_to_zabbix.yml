---
- name: "Sincronizar Dispositivos de NetBox a Zabbix"
  hosts: all
  gather_facts: false

  tasks:
    - name: "Crear el host en Zabbix"
      community.zabbix.zabbix_host:
        # Volvemos a server_url según tu lista de parámetros soportados
        server_url: "http://TU_IP_ZABBIX/api_jsonrpc.php"
        # Usamos el token en el campo de password (truco común en estas versiones)
        http_login_password: "{{ zabbix_api_token }}"
        host_name: "{{ inventory_hostname }}"
        visible_name: "{{ inventory_hostname }}"
        status: enabled
        interfaces:
          - type: 2 
            main: 1
            useip: 1
            ip: "{{ ansible_host }}"
            port: "161"
        host_groups:
          - "Switches Uruguay"
        link_templates:
          - "Huawei CloudEngine SNMP"
      delegate_to: localhost
      when: ansible_host is defined
