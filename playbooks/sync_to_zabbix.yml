---
- name: "Sincronizar Dispositivos de NetBox a Zabbix"
  hosts: all
  gather_facts: false

  tasks:
    - name: "Crear el host en Zabbix"
      community.zabbix.zabbix_host:
        # En esta versión, intentamos usar el nombre directo del parámetro de la API
        zabbix_url: "http://10.0.0.23/api_jsonrpc.php"
        http_login_password: "{{ zabbix_api_token }}"
        host_name: "{{ inventory_hostname }}"
        visible_name: "{{ inventory_hostname }}"
        status: enabled
        interfaces:
          - type: 2 
            main: 1
            useip: 1
            ip: "{{ ansible_host }}"
            port: "161"
        host_groups:
          - "Switches Uruguay"
        link_templates:
          - "Huawei CloudEngine SNMP"
      delegate_to: localhost
      # Si zabbix_url sigue fallando, la colección espera que la URL 
      # se pase como una variable de entorno o directamente en la configuración del módulo.
      vars:
        ansible_zabbix_url: "http://TU_IP_ZABBIX/api_jsonrpc.php"
        ansible_zabbix_auth_key: "{{ zabbix_api_token }}"
      when: ansible_host is defined
