---
- name: "Sincronizar NetBox a Zabbix"
  hosts: all
  gather_facts: false
  connection: local

  tasks:
    - name: "Crear Host en Zabbix"
      community.zabbix.zabbix_host:
        # Solo dejamos los datos del host, nada de conexión aquí
        host_name: "{{ inventory_hostname }}"
        visible_name: "{{ inventory_hostname }}"
        status: enabled
        interfaces:
          - type: 2
            main: 1
            useip: 1
            ip: "{{ ansible_host }}"
            port: "161"
        host_groups:
          - "Switches Uruguay"
        link_templates:
          - "Huawei VRP by SNMP"
      # Aquí inyectamos los datos de conexión con los nombres mágicos de Ansible
      vars:
        ansible_zabbix_url: "http://10.0.0.23/zabbix/api_jsonrpc.php"
        ansible_zabbix_auth_key: "{{ zabbix_api_token }}"
      delegate_to: localhost
      when: ansible_host is defined
