---
- name: "Backup Huawei via AWX"
  hosts: all
  gather_facts: no
  connection: local
  collections:
    - ansible.netcommon
  tasks:
    - name: "Obtener configuracion actual del switch"
      ansible.netcommon.telnet:
        host: "{{ ansible_host }}"
        user: "{{ ansible_user }}"
        password: "{{ ansible_password }}"
        login_prompt: "Username:"
        password_prompt: "Password:"
        prompts:
          - "[>|#]"
        command:
          - screen-length 0 temporary
          - display current-configuration
      register: backup_raw

    - name: "Mostrar el backup en el log de AWX"
      debug:
        msg: "{{ backup_raw.output }}"
