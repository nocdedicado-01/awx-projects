---
- name: "Backup Huawei via AWX"
  hosts: all
  gather_facts: no
  connection: local
  collections:
    - ansible.netcommon
  tasks:
    - name: "Obtener configuracion actual del switch"
      ansible.netcommon.telnet:
        host: "{{ ansible_host }}"
        user: "{{ ansible_user }}"
        password: "{{ ansible_password }}"
        login_prompt: "Username:"
        password_prompt: "Password:"
        prompts:
          - "[>|#]"
        command:
          - screen-length 0 temporary
          - display current-configuration
        timeout: 30
      register: backup_raw
      ignore_errors: yes

    - name: "Mostrar backup del primer switch exitoso"
      debug:
        msg: "{{ backup_raw.output }}"
      when:
        - backup_raw.output is defined
        - backup_raw.failed is not defined or not backup_raw.failed
        - inventory_hostname == "AR0100_ASW1"
      

    - name: "Confirmar switches que fallaron"
      debug:
        msg: "FALLO la conexion a {{ inventory_hostname }}"
      when: backup_raw.failed is defined and backup_raw.failed
